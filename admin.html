<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>관리자 · 속시원</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="css/style.css?v=20261014q">
<style>
.abar{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:6px;margin-bottom:14px;position:sticky;top:104px;z-index:10;background:var(--bg)}
.abar::-webkit-scrollbar{display:none}
.abar button{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:inherit;font-size:.85rem;font-weight:600;padding:8px 12px;border-radius:999px;white-space:nowrap;cursor:pointer}
.abar button[aria-selected=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.panel{display:grid;gap:14px}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}
.acard .ah{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.acard .ah p{font-size:.82rem;color:var(--muted);flex-basis:100%}
.f{display:grid;gap:5px}
.f>label{font-size:.82rem;font-weight:600;color:var(--muted)}
.f input,.f textarea,.f select{font-size:.92rem}
.f textarea{min-height:64px}
.rg{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center}
.rg span{color:var(--muted)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px} .g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media (max-width:460px){.g2,.g3{grid-template-columns:1fr}}
table.edit{min-width:0;width:100%}
table.edit td,table.edit th{padding:6px 6px;vertical-align:middle}
table.edit td:first-child,table.edit th:first-child{min-width:0;white-space:nowrap;font-weight:600;font-size:.84rem}
table.edit input{padding:7px 8px;font-size:.86rem;min-width:88px}
table.edit .rg{grid-template-columns:1fr auto 1fr;min-width:160px}
table.edit input[type=text]{min-width:120px}
.item{display:grid;gap:8px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.item .ih{display:flex;justify-content:space-between;align-items:center;font-size:.82rem;color:var(--muted);font-weight:600}
.item input,.item textarea{background:var(--surface)}
.x{appearance:none;border:0;background:transparent;color:var(--muted);font-size:1.05rem;cursor:pointer;padding:0 6px;line-height:1}
.x:hover{color:var(--warn)}
.actions{position:sticky;bottom:0;z-index:12;margin-top:18px;background:var(--bg);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.actions .sp{flex:1}
.more{display:none;width:100%;gap:8px;flex-wrap:wrap;padding-top:8px;border-top:1px dashed var(--line)}
.more.open{display:flex}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);z-index:60;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.86rem;font-weight:600;box-shadow:var(--shadow);max-width:90vw}
.toast.bad{background:var(--warn);color:#fff}
.gate{max-width:420px}
.send-dlg{border:1px solid var(--line);border-radius:14px;padding:0;width:min(560px,94vw);background:var(--surface);color:var(--fg)}
.send-dlg::backdrop{background:rgba(15,42,68,.45)}
.send-dlg .sd-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.send-dlg .panel{padding:14px 16px;gap:10px}
.send-dlg textarea{font-size:.88rem}
.tech-list{display:grid;gap:6px;max-height:40vh;overflow:auto}
.tech-opt{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);cursor:pointer}
.tech-opt input{accent-color:var(--accent);width:18px;height:18px;margin:0;flex-shrink:0}
.tech-opt .tn{display:grid;gap:2px;min-width:0}
.tech-opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.tech-opt.off{opacity:.55}
.btn.disabled{opacity:.5;pointer-events:auto}
.kv{font-size:.82rem;color:var(--muted)}
.badge{font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent-ink)}
.badge.local{background:var(--warn-soft);color:var(--warn)}
</style>
</head>
<body>
<header class="top"></header>
<main class="wrap">

<div class="page-head">
  <span class="eyebrow">관리자 전용</span>
  <h1>속시원 사이트 관리 <span class="badge" id="mode-badge" hidden></span></h1>
  <p id="mode-desc">확인 중입니다…</p>
</div>

<section id="gate" hidden>
  <form class="form gate" id="setup" hidden novalidate>
    <div><span class="eyebrow">처음 설정</span><h2>관리자 비밀번호를 정해 주세요</h2><p class="small muted">이 서버에 아직 관리자 비밀번호가 없습니다. 8자 이상으로 정하면 바로 로그인됩니다.</p></div>
    <div class="fs"><label class="lbl" for="su-pw">비밀번호</label><input type="password" id="su-pw" autocomplete="new-password"></div>
    <div class="fs"><label class="lbl" for="su-pw2">비밀번호 확인</label><input type="password" id="su-pw2" autocomplete="new-password"></div>
    <p class="err" id="su-err" hidden></p>
    <button class="btn primary block" type="submit">비밀번호 설정하고 시작</button>
  </form>
  <form class="form gate" id="login" hidden novalidate>
    <div><span class="eyebrow">관리자 로그인</span><h2>비밀번호를 입력해 주세요</h2></div>
    <div class="fs"><label class="lbl" for="li-pw">비밀번호</label><input type="password" id="li-pw" autocomplete="current-password"></div>
    <p class="err" id="li-err" hidden></p>
    <button class="btn primary block" type="submit">로그인</button>
    <p class="small muted">비밀번호를 잊었다면 서버의 <code>admin/auth.php</code> 파일을 지우고 다시 설정하거나, 배포 스크립트에 새 비밀번호를 넣어 다시 올리면 됩니다.</p>
  </form>
</section>

<section id="editor" hidden>
  <div class="abar" id="tabs" role="tablist"></div>
  <div class="panel" id="panel"></div>
  <div class="actions">
    <button class="btn sm" type="button" id="act-preview">미리보기</button>
    <button class="btn sm" type="button" id="act-reset">이 탭 기본값</button>
    <span class="sp"></span>
    <button class="btn sm" type="button" id="act-more">더보기</button>
    <button class="btn primary" type="button" id="act-save">저장</button>
    <div class="more" id="more">
      <button class="btn sm" type="button" id="act-export">설정 내보내기 (JSON)</button>
      <label class="btn sm">설정 가져오기<input type="file" id="act-import" accept=".json,.js" hidden></label>
      <button class="btn sm" type="button" id="act-download">config.js 내려받기</button>
      <button class="btn sm" type="button" id="act-reset-all">전체 기본값으로</button>
      <button class="btn sm" type="button" id="act-pw" hidden>비밀번호 변경</button>
      <button class="btn sm" type="button" id="act-logout" hidden>로그아웃</button>
    </div>
  </div>
</section>

<p class="toast" id="toast" hidden></p>
<dialog id="send-dlg" class="send-dlg"><div class="sd-head"><b>기사에게 보내기</b><button class="x" type="button" id="send-close" aria-label="닫기">✕</button></div><div id="send-body" class="panel"></div></dialog>

</main>
<footer></footer>
<script>document.write('<script src="data/config.js?t='+Date.now()+'"><\/script>');</script>
<script src="js/common.js?v=20261014p"></script>
<script>
(function(){
'use strict';
const S=window.SSW; const {$, esc, load, save, rangeShort, rangeText, fmtDate, deepMerge, getPath, DEFAULTS, TYPE_LABEL}=S;
const clone=o=>JSON.parse(JSON.stringify(o));
const isObj=v=>!!v&&typeof v==='object'&&!Array.isArray(v);
function setPath(o,p,v){ const ks=p.split('.'); let a=o; for(let i=0;i<ks.length-1;i++){ if(a[ks[i]]==null) a[ks[i]]=/^\d+$/.test(ks[i+1])?[]:{}; a=a[ks[i]]; } a[ks[ks.length-1]]=v; }
let mode='local', st={}, draft=null, tab='basic';
try{ const h=location.hash.slice(1); if(/^(basic|home|pages|guide|rates|brands|rent|techs|inbox)$/.test(h)) tab=h; }catch(e){}

/* ---------- 서버 API ---------- */
async function api(action,data){
  const opt={method:data?'POST':'GET', credentials:'same-origin', headers:{'X-Requested-With':'SSW'}};
  if(data){ opt.headers['Content-Type']='application/json'; opt.body=JSON.stringify(data); }
  const r=await fetch('admin/api.php?action='+action+'&_='+Date.now(), opt);
  const t=await r.text(); return JSON.parse(t);
}
function toast(msg,bad){ const t=$('toast'); t.textContent=msg; t.className='toast'+(bad?' bad':''); t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>{t.hidden=true;},3500); }
function fromConfig(cfg){ cfg=isObj(cfg)?cfg:{}; return {
  site:deepMerge(DEFAULTS.site, isObj(cfg.site)?cfg.site:{}), rates:deepMerge(DEFAULTS.rates, isObj(cfg.rates)?cfg.rates:{}),
  brands:(Array.isArray(cfg.brands)&&cfg.brands.length)?clone(cfg.brands):clone(DEFAULTS.brands), rent:deepMerge(DEFAULTS.rent, isObj(cfg.rent)?cfg.rent:{}) }; }
function toConfig(){ return {site:draft.site, rates:draft.rates, brands:draft.brands, rent:draft.rent, savedAt:new Date().toISOString()}; }
function keepLocal(){ if(mode==='local'){ try{ localStorage.setItem('ssw_cfg_draft', JSON.stringify(toConfig())); }catch(e){} } }

async function init(){
  try{ st=await api('status'); if(st&&st.server) mode='server'; }catch(e){ mode='local'; }
  const badge=$('mode-badge'); badge.hidden=false;
  if(mode==='server'){
    badge.textContent='서버 저장';
    $('mode-desc').textContent='저장을 누르면 이 주소의 모든 페이지에 바로 반영됩니다. 고객 예약·기업 문의는 "접수 내역" 탭에 실시간으로 들어옵니다.';
    $('act-pw').hidden=false; $('act-logout').hidden=false; $('act-download').hidden=true;
    if(!st.hasPassword){ $('gate').hidden=false; $('setup').hidden=false; }
    else if(!st.loggedIn){ $('gate').hidden=false; $('login').hidden=false; }
    else await openServer();
  }else{
    badge.textContent='로컬 모드'; badge.className='badge local';
    $('mode-desc').textContent='이 주소에는 저장 서버(PHP)가 없어 수정 내용이 이 브라우저에만 보관됩니다. 다 고친 뒤 "config.js 내려받기"로 받은 파일을 프로젝트의 data/config.js 에 넣고 배포하면 반영됩니다. 카페24 주소(soksiwon-air.com/admin.html)에서는 바로 저장됩니다.';
    let d=null; try{ d=JSON.parse(localStorage.getItem('ssw_cfg_draft')||'null'); }catch(e){}
    draft = d ? fromConfig(d) : fromConfig(S.CFG);
    openEditor();
  }
}
async function openServer(){
  try{ const r=await api('load'); if(!r.ok){ if(r.error==='auth'){ $('gate').hidden=false; $('login').hidden=false; return; } throw new Error(r.error); }
    draft=fromConfig(r.config); if(r.writable===false) toast('data 폴더에 쓰기 권한이 없어 저장이 실패할 수 있습니다. FTP에서 data 폴더 권한을 707로 바꿔 주세요.', true);
    openEditor();
  }catch(e){ toast('설정을 불러오지 못했습니다: '+e.message, true); }
}
function openEditor(){ $('gate').hidden=true; $('editor').hidden=false; renderTabs(); render(); startInboxPolling(); loadTechs(); }
/* 보내기 창 */
document.addEventListener('click', async e=>{
  const t=e.target.closest('[data-send]'); if(!t||!sendCtx) return;
  const sel=pickedTechs(); const text=$('send-text').value;
  if(t.dataset.send==='kakao'){ if(!sel.length){ toast('보낼 기사를 선택해 주세요.',true); return; }
    if(navigator.share && window.isSecureContext){ try{ await navigator.share({text}); await markSent(sel); $('send-dlg').close(); }catch(err){} return; }
    /* http 주소나 PC: 공유 창이 없음 → 문구 복사 후 카카오톡 열기 */
    let copied=false; try{ await navigator.clipboard.writeText(text); copied=true; }catch(err){ const ta=$('send-text'); ta.focus(); ta.select(); try{ copied=document.execCommand('copy'); }catch(e2){} }
    const mobile=/Android|iPhone|iPad/i.test(navigator.userAgent);
    toast(copied?('문구를 복사했습니다. '+(mobile?'카카오톡이 열리면 기사와의 대화방에 붙여 넣으세요.':'카카오톡 PC 대화창에 붙여 넣으세요.')):'복사가 막혔습니다. 문구를 길게 눌러 복사해 주세요.', !copied);
    await markSent(sel);
    if(mobile){ setTimeout(()=>{ location.href='kakaotalk://launch'; }, 600); }
    return; }
  if(t.dataset.send==='copy'){ try{ await navigator.clipboard.writeText(text); toast('복사했습니다.'); }catch(err){ toast('복사 실패. 문구를 드래그해서 복사하세요.',true); } return; }
  if(t.dataset.send==='mark'){ if(!sel.length){ toast('보낼 기사를 선택해 주세요.',true); return; } await markSent(sel); $('send-dlg').close(); return; }
});
document.addEventListener('change', e=>{ if(e.target.dataset&&e.target.dataset.pick&&sendCtx){ if(e.target.checked) sendCtx.picked.add(e.target.dataset.pick); else sendCtx.picked.delete(e.target.dataset.pick); renderSend(); } });
document.addEventListener('click', e=>{ if(e.target.id==='send-sms' && e.target.classList.contains('disabled')){ e.preventDefault(); toast('보낼 기사를 선택해 주세요.',true); } else if(e.target.id==='send-sms' && sendCtx){ const sel=pickedTechs(); if(sel.length) setTimeout(()=>markSent(sel), 800); } });
document.addEventListener('click', e=>{ if(e.target.id==='send-close'){ $('send-dlg').close(); } });

/* ---------- 로그인/설정 ---------- */
$('setup').addEventListener('submit', async e=>{ e.preventDefault(); const pw=$('su-pw').value, pw2=$('su-pw2').value, err=$('su-err');
  if(pw.length<8){ err.hidden=false; err.textContent='8자 이상으로 정해 주세요.'; return; } if(pw!==pw2){ err.hidden=false; err.textContent='두 비밀번호가 다릅니다.'; return; }
  try{ const r=await api('setup',{password:pw}); if(!r.ok) throw new Error(r.error==='already_set'?'이미 비밀번호가 있습니다. 로그인해 주세요.':r.error); $('setup').hidden=true; await openServer(); }
  catch(ex){ err.hidden=false; err.textContent=ex.message; } });
$('login').addEventListener('submit', async e=>{ e.preventDefault(); const err=$('li-err');
  try{ const r=await api('login',{password:$('li-pw').value}); if(!r.ok){ err.hidden=false; err.textContent= r.error==='locked'?'틀린 횟수가 많아 15분간 잠겼습니다.':'비밀번호가 맞지 않습니다.'; return; } $('login').hidden=true; $('li-pw').value=''; await openServer(); }
  catch(ex){ err.hidden=false; err.textContent='서버 응답이 없습니다: '+ex.message; } });
$('act-logout').addEventListener('click', async ()=>{ try{ await api('logout',{}); }catch(e){} location.reload(); });
$('act-pw').addEventListener('click', async ()=>{ const cur=prompt('현재 비밀번호'); if(cur==null) return; const nw=prompt('새 비밀번호 (8자 이상)'); if(nw==null) return;
  try{ const r=await api('password',{current:cur,password:nw}); toast(r.ok?'비밀번호를 바꿨습니다.':(r.error==='wrong'?'현재 비밀번호가 틀립니다.':'실패: '+r.error), !r.ok); }catch(e){ toast('실패: '+e.message,true); } });

/* ---------- 탭 ---------- */
const TABS=[['basic','기본 정보'],['home','첫 화면'],['pages','페이지 문구'],['guide','약속·절차·FAQ'],['rates','단가'],['brands','브랜드·제품'],['rent','렌탈'],['techs','제휴 기사'],['inbox','접수 내역']];
function renderTabs(){ $('tabs').innerHTML=TABS.map(([k,l])=>'<button type="button" role="tab" data-tab="'+k+'" aria-selected="'+(k===tab)+'">'+l+(k==='inbox'&&lastNewCount?' <span class="badge" style="background:var(--warn);color:#fff">'+lastNewCount+'</span>':'')+'</button>').join(''); }
$('tabs').addEventListener('click', e=>{ const b=e.target.closest('[data-tab]'); if(!b) return; tab=b.dataset.tab; try{ history.replaceState(null,'','#'+tab); }catch(e){} renderTabs(); render(); window.scrollTo({top:0}); });

/* ---------- 필드 ---------- */
const fText=(p,label,hint,ta)=>{ const v=getPath(draft,p); return '<div class="f"><label>'+esc(label)+(hint?' <span class="hint">'+esc(hint)+'</span>':'')+'</label>'+(ta?'<textarea data-p="'+p+'">'+esc(v==null?'':v)+'</textarea>':'<input type="text" data-p="'+p+'" value="'+esc(v==null?'':v)+'">')+'</div>'; };
const fNum=(p,label,hint)=>'<div class="f"><label>'+esc(label)+(hint?' <span class="hint">'+esc(hint)+'</span>':'')+'</label><input type="number" step="any" inputmode="decimal" data-p="'+p+'" data-n="1" value="'+esc(getPath(draft,p))+'"></div>';
const rg=p=>{ const v=getPath(draft,p)||[0,0]; return '<div class="rg"><input type="number" step="any" inputmode="numeric" data-p="'+p+'.0" data-n="1" value="'+v[0]+'"><span>~</span><input type="number" step="any" inputmode="numeric" data-p="'+p+'.1" data-n="1" value="'+v[1]+'"></div>'; };
const fRange=(p,label,hint)=>'<div class="f"><label>'+esc(label)+(hint?' <span class="hint">'+esc(hint)+'</span>':'')+'</label>'+rg(p)+'</div>';
const fBool=(p,label)=>'<label class="chip"><input type="checkbox" data-p="'+p+'" data-b="1"'+(getPath(draft,p)!==false?' checked':'')+'>'+esc(label)+'</label>';
const card=(title,inner,desc,extra)=>'<div class="acard"><div class="ah"><h3>'+esc(title)+'</h3>'+(extra||'')+(desc?'<p>'+esc(desc)+'</p>':'')+'</div>'+inner+'</div>';
const del=p=>'<button class="x" type="button" data-del="'+p+'" title="삭제">✕</button>';
const addBtn=(p,tpl,label)=>'<button class="btn sm" type="button" data-add="'+p+'" data-tpl=\''+esc(JSON.stringify(tpl))+'\'>+ '+esc(label)+'</button>';

const RL={ base:'신규 설치 기본 (배관 별도)', moveBase:'이전 설치 기본 (배관 별도)', remove:'기존 에어컨 철거', pipePerM:'배관 1m당', pipeReplace:'매립 배관 교체·연결', angle:'실외기 앵글', gas:'냉매 보충 (설치 시)', gasFill:'냉매 충전 (수리 방문)', clean:'분해 청소 1대', fan:'송풍팬 완전 분해', paper:'부분 도배 마감', protect:'거주 중 가구 이동·보양' };
const RC={ ladder:'사다리차·스카이차 (4시간)', hole:'타공 1곳', elecBase:'전용 전기 작업 기본', elecPer:'전용 전기 작업 대당', outdoorClean:'실외기 세척 1대', visit:'수리·충전 출장 점검비', regionOut:'인접 지역 출장 가산', floorMid:'3~5층 작업 가산', floorHigh:'6층 이상 작업 가산', distCity:'운반 (같은 시·군)', distFar:'운반 (다른 시·도)', highMount:'고소 작업 (3m 이상)', leakCheck:'누설 점검·용접', oldPart:'구형 모델 부품 가산' };

let techs=[]; let techsLoaded=false;
async function loadTechs(){ if(mode==='server'){ try{ const r=await api('techs'); if(r.ok){ techs=r.techs||[]; } }catch(e){} } else { try{ techs=JSON.parse(localStorage.getItem('ssw_techs')||'[]'); }catch(e){ techs=[]; } } techsLoaded=true; if(tab==='techs') render(); }
async function saveTechs(){ techs=techs.filter(t=>(t.name||t.phone)); if(mode==='server'){ try{ const r=await api('techs_save',{techs}); if(r.ok){ techs=r.techs; toast('기사 목록을 저장했습니다.'); } else toast('저장 실패: '+r.error,true); }catch(e){ toast('저장 실패: '+e.message,true); } } else { try{ localStorage.setItem('ssw_techs',JSON.stringify(techs)); toast('이 브라우저에 저장했습니다.'); }catch(e){} } render(); }
function renderTechs(){
  const rows = techs.map((t,i)=>'<div class="item"><div class="ih"><span>'+(i+1)+'. '+esc(t.name||'이름 없음')+'</span><span><label class="chip" style="padding:4px 10px;font-size:.8rem"><input type="checkbox" data-tp="'+i+'.active"'+(t.active!==false?' checked':'')+'>활동 중</label> <button class="x" type="button" data-tech-del="'+i+'" title="삭제">✕</button></span></div>'+
    '<div class="g3"><div class="f"><label>이름</label><input type="text" data-tp="'+i+'.name" value="'+esc(t.name||'')+'"></div><div class="f"><label>휴대폰</label><input type="tel" data-tp="'+i+'.phone" value="'+esc(t.phone||'')+'" placeholder="010-0000-0000"></div><div class="f"><label>담당 지역</label><input type="text" data-tp="'+i+'.area" value="'+esc(t.area||'')+'" placeholder="세종, 청주 서원구"></div></div>'+
    '<div class="g2"><div class="f"><label>담당 작업</label><input type="text" data-tp="'+i+'.skills" value="'+esc(t.skills||'')+'" placeholder="설치, 시스템, 청소, 이전"></div><div class="f"><label>메모</label><input type="text" data-tp="'+i+'.memo" value="'+esc(t.memo||'')+'" placeholder="보험 가입, 사다리차 보유 등"></div></div></div>').join('');
  return card('제휴 기사 목록 ('+techs.length+'명)', (techsLoaded?(rows||'<div class="empty">등록된 기사가 없습니다. 아래에서 추가하세요.</div>'):'<div class="empty">불러오는 중…</div>')+
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px"><button class="btn sm" type="button" data-act="tech-add">+ 기사 추가</button><button class="btn primary sm" type="button" data-act="tech-save">기사 목록 저장</button></div>',
    '접수 내역에서 "기사에게 보내기"를 누르면 이 목록에서 골라 알림 문구를 카카오톡·문자로 보냅니다. 고객 연락처와 상세 주소는 문구에 들어가지 않습니다.');

function techMessage(b, tech){
  const c=b.customer||{}; const brand=(window.SSW.SITE&&window.SSW.SITE.brand&&window.SSW.SITE.brand.name)||'속시원';
  const lines=['['+brand+'] 새 예약 '+(b.id||''), '방문 지역: '+(window.SSW.regionOnly(c.addr||'')||'-'), '작업: '+(b.svcLabel||'')+' · '+(b.summary||'')];
  if(b.models&&b.models.length) lines.push('제품: '+b.models.join(', ')+' (회사 창고 수령)');
  lines.push('희망 일자: '+fmtDate(c.date)+' '+(c.slot||''));
  if(b.items&&b.items.length) lines.push('작업 내용: '+b.items.map(i=>i.label).join(', '));
  if(b.site||c.memo) lines.push('현장 정보: '+[b.site,c.memo].filter(Boolean).join(' · '));
  if(b.payout) lines.push('정산 금액: '+rangeText(b.payout[0],b.payout[1])+' (시공비에서 수수료 차감)');
  lines.push('', (tech&&tech.name?tech.name+' 기사님, ':'')+'가능하시면 "수락"이라고 답장 주세요. 수락 후 고객 연락처와 상세 주소를 보내 드립니다.');
  return lines.join('\n');
}

  sendCtx={b, picked:new Set(active.length===1?[active[0].id]:[])};
  renderSend();
  const dlg=$('send-dlg'); if(typeof dlg.showModal==='function'){ if(!dlg.open) dlg.showModal(); } else dlg.setAttribute('open','');
}

    '<div class="kv">'+esc(b.id)+' · '+esc(b.svcLabel||'')+' · '+esc(window.SSW.regionOnly(c.addr||''))+' · '+fmtDate(c.date)+'</div>'+
    '<div class="f"><label>보낼 기사 선택 <span class="hint">여러 명 선택 가능 · 먼저 수락한 기사에게 배정</span></label><div class="tech-list">'+
      techs.map(t=>'<label class="tech-opt'+(t.active===false?' off':'')+'"><input type="checkbox" data-pick="'+esc(t.id)+'"'+(sendCtx.picked.has(t.id)?' checked':'')+(t.active===false?' disabled':'')+'><span class="tn"><b>'+esc(t.name||'이름 없음')+'</b>'+(t.active===false?' <span class="tag">휴무</span>':'')+'<span class="muted small">'+esc(t.phone||'번호 없음')+(t.area?' · '+esc(t.area):'')+(t.skills?' · '+esc(t.skills):'')+'</span></span></label>').join('')+
    '</div></div>'+
    '<div class="f"><label>보낼 문구 <span class="hint">필요하면 고쳐서 보내세요</span></label><textarea id="send-text" style="min-height:200px">'+esc(techMessage(b, sel.length===1?first:null))+'</textarea></div>'+
    '<div class="g2"><button class="btn primary" type="button" data-send="kakao"'+(sel.length?'':' disabled')+'>카카오톡으로 보내기'+(sel.length>1?' ('+sel.length+'명)':'')+'</button>'+
      '<a class="btn'+(sel.length?'':' disabled')+'" id="send-sms" href="'+(sel.length?('sms:'+sel.map(t=>(t.phone||'').replace(/[^0-9+]/g,'')).filter(Boolean).join(',')+'?body='+encodeURIComponent(techMessage(b, sel.length===1?first:null))):'#')+'">문자로 보내기'+(sel.length>1?' ('+sel.length+'명)':'')+'</a></div>'+
    '<div class="g2"><button class="btn sm" type="button" data-send="copy">문구만 복사</button><button class="btn sm" type="button" data-send="mark"'+(sel.length?'':' disabled')+'>보냈다고 기록만</button></div>'+
    (window.isSecureContext?'':'<p class="kv" style="color:var(--warn)">지금 주소가 http라서 휴대폰 공유 창이 열리지 않습니다. 카카오톡 버튼은 문구를 복사한 뒤 카카오톡 앱을 열어 주니, 기사와의 대화방에 붙여 넣으세요. 보안 인증서(SSL)를 켜면 공유 창에서 바로 보낼 수 있습니다.</p>')+
    '<p class="kv">보내고 나면 상태가 "기사 알림"으로 바뀌고 기사 이름이 기록됩니다. 문자 버튼은 바로 문자 앱이 열립니다.</p>';
}
async function markSent(sel){ const {b}=sendCtx; const names=sel.map(t=>(t.name||'')+(t.phone?' '+t.phone:'')).join(', '); try{ const r=await api('inbox_update',{type:'booking',id:b.id,status:'기사 알림',tech:names}); if(r.ok){ toast(sel.map(t=>t.name).join(', ')+' 기사에게 보낸 것으로 기록했습니다.'); loadInbox(false); } }catch(e){} }
const STATUS_BK=['신규','기사 알림','연락 완료','기사 배정','시공 완료','취소']; const STATUS_IQ=['신규','회신 완료','견적 발송','계약','취소'];
let inbox={bookings:[],inquiries:[],loaded:false,err:''}; let inboxTimer=null; let lastNewCount=null;
const fmtWhen = s => { try{ return new Date(s).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}); }catch(e){ return s||''; } };
const statusSel=(type,id,cur,opts)=>'<select class="st" data-type="'+type+'" data-id="'+esc(id)+'">'+opts.map(o=>'<option'+(o===cur?' selected':'')+'>'+o+'</option>').join('')+'</select>';
const stTag = s => { if(!s||s==='신규') return 'warn'; if(/완료|계약/.test(s)) return 'ok'; if(/취소/.test(s)) return ''; return 'acc'; };
async function loadInbox(silent){
  try{ const r=await api('inbox'); if(!r.ok){ if(r.error==='auth'){ $('editor').hidden=true; $('gate').hidden=false; $('login').hidden=false; } return; }
    inbox={bookings:r.bookings||[],inquiries:r.inquiries||[],loaded:true,err:''};
    const newCount=inbox.bookings.filter(b=>(b.status||'신규')==='신규').length+inbox.inquiries.filter(i=>(i.status||'신규')==='신규').length;
    if(lastNewCount!==null && newCount>lastNewCount && silent) toast('새 접수 '+(newCount-lastNewCount)+'건이 들어왔습니다.');
    lastNewCount=newCount; renderTabs(); if(tab==='inbox') render();
  }catch(e){ inbox.err=e.message; if(tab==='inbox') render(); }
}
function startInboxPolling(){ if(mode!=='server') return; loadInbox(false); if(!inboxTimer) inboxTimer=setInterval(()=>loadInbox(true), 20000); document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) loadInbox(true); }); }
function renderInboxServer(){
  const bk=inbox.bookings, tc=inbox.inquiries;
  const head = '<div class="kv">'+(inbox.loaded?'서버 접수함 · 20초마다 자동 갱신':'불러오는 중…')+(inbox.err?' · 오류: '+esc(inbox.err):'')+' <button class="btn sm" type="button" data-act="refresh" style="margin-left:8px">지금 새로고침</button></div>';
  const bkH = bk.length ? bk.map(b=>{ const c=b.customer||{}; return '<div class="bk"><div class="h"><span>'+esc(b.id)+' · '+esc(b.svcLabel||'')+' <span class="muted small">'+fmtWhen(b.receivedAt||b.createdAt)+'</span></span><span class="tag '+stTag(b.status)+'">'+esc(b.status||'신규')+'</span></div>'+
    '<div>'+esc(b.summary||'')+(b.total?' · <b class="num">'+rangeShort(b.total[0],b.total[1])+'</b>':'')+'</div>'+(b.models&&b.models.length?'<div class="muted">'+esc(b.models.join(', '))+'</div>':'')+
    '<div><b>'+esc(c.name||'')+'</b> · <a href="tel:'+esc(c.phone||'')+'">'+esc(c.phone||'')+'</a> · '+esc(c.addr||'')+' '+esc(c.addr2||'')+'</div>'+
    '<div class="muted">희망 '+fmtDate(c.date)+' '+esc(c.slot||'')+(b.payout?' · 기사 정산 <span class="num">'+rangeText(b.payout[0],b.payout[1])+'</span>':'')+'</div>'+
    (b.site||c.memo?'<div class="muted small">'+esc([b.site,c.memo].filter(Boolean).join(' · '))+'</div>':'')+
    (b.tech?'<div class="small" style="color:var(--accent-ink)">기사 알림: '+esc(b.tech)+(b.notifiedAt?' · '+fmtWhen(b.notifiedAt):'')+'</div>':'')+'<div class="g2" style="margin-top:6px;align-items:center"><div>'+statusSel('booking',b.id,b.status||'신규',STATUS_BK)+'</div><div style="text-align:right;display:flex;gap:6px;justify-content:flex-end"><button class="btn primary sm" type="button" data-send-rec="'+esc(b.id)+'">기사에게 보내기</button><button class="btn sm" type="button" data-del-rec="booking" data-id="'+esc(b.id)+'">삭제</button></div></div></div>'; }).join('')
    : '<div class="empty">'+(inbox.loaded?'아직 접수된 예약이 없습니다.':'불러오는 중…')+'</div>';
  const tcH = tc.length ? tc.map(t=>'<div class="bk"><div class="h"><span>'+esc(t.id)+' · '+esc(t.company||'')+' · '+esc(t.kind||'')+' <span class="muted small">'+fmtWhen(t.receivedAt||t.at)+'</span></span><span class="tag '+stTag(t.status)+'">'+esc(t.status||'신규')+'</span></div>'+
    '<div><b>'+esc(t.name||'')+'</b> · <a href="tel:'+esc(t.phone||'')+'">'+esc(t.phone||'')+'</a>'+(t.email?' · '+esc(t.email):'')+' · '+esc(t.addr||'주소 없음')+' · '+esc(t.via||'')+'</div>'+
    '<div class="muted">'+esc((t.sites||[]).map(s=>s.space+' '+s.count+' '+s.py).join(', ')||'설치 내용 없음')+' · '+esc((t.svc||[]).join(', '))+(t.date?' · 희망 '+esc(t.date):'')+'</div>'+
    (t.memo?'<div class="muted small">'+esc(t.memo)+'</div>':'')+(t.text?'<details><summary class="small">문의서 전문</summary><pre class="small" style="white-space:pre-wrap;margin:6px 0 0">'+esc(t.text)+'</pre></details>':'')+
    '<div class="g2" style="margin-top:6px;align-items:center"><div>'+statusSel('inquiry',t.id,t.status||'신규',STATUS_IQ)+'</div><div style="text-align:right"><button class="btn sm" type="button" data-del-rec="inquiry" data-id="'+esc(t.id)+'">삭제</button></div></div></div>').join('')
    : '<div class="empty">'+(inbox.loaded?'아직 문의가 없습니다.':'불러오는 중…')+'</div>';
  return head+card('예약·렌탈 상담 ('+bk.length+')', '<div class="admin">'+bkH+'</div>', '고객이 예약 신청을 누르면 바로 여기에 들어옵니다. 상태를 바꾸면 서버에 저장됩니다.')+
    card('기업 전용 문의 ('+tc.length+')', '<div class="admin">'+tcH+'</div>');
}
function renderInbox(){
  const bk=load('ssw_bookings'), tc=load('ssw_biz');
  const bkH = bk.length ? bk.map(b=>'<div class="bk"><div class="h"><span>'+b.id+' · '+esc(b.svcLabel)+'</span><span class="tag '+(b.status.startsWith('기사 수락')?'ok':b.status.startsWith('거절')?'warn':'acc')+'">'+esc(b.status)+'</span></div>'+
    '<div>'+esc(b.summary)+' · <b class="num">'+rangeShort(b.total[0],b.total[1])+'</b></div>'+(b.models&&b.models.length?'<div class="muted">'+esc(b.models.join(', '))+'</div>':'')+
    '<div class="muted">'+esc(b.customer.name)+' · '+esc(b.customer.phone)+' · '+esc(b.customer.addr)+' '+esc(b.customer.addr2)+'</div>'+
    '<div class="muted">희망 '+fmtDate(b.customer.date)+' '+esc(b.customer.slot)+' · 기사 정산 <span class="num">'+rangeText(b.payout[0],b.payout[1])+'</span></div>'+
    '<div class="muted small">접수 '+new Date(b.createdAt).toLocaleString('ko-KR')+(b.site?' · '+esc(b.site):'')+(b.customer.memo?' · 메모: '+esc(b.customer.memo):'')+'</div></div>').join('') : '<div class="empty">아직 접수된 예약이 없습니다.</div>';
  const tcH = tc.length ? tc.map(t=>'<div class="bk"><div class="h"><span>'+t.id+' · '+esc(t.company)+' · '+esc(t.kind)+'</span><span class="tag acc">'+esc(t.via)+' · '+esc(t.status)+'</span></div>'+
    '<div class="muted">'+esc(t.name)+' · '+esc(t.phone)+(t.email?' · '+esc(t.email):'')+' · '+esc(t.addr||'주소 없음')+'</div>'+
    '<div class="muted">'+esc((t.sites||[]).map(s=>s.space+' '+s.count+' '+s.py).join(', ')||'설치 내용 없음')+' · '+esc((t.svc||[]).join(', '))+'</div>'+
    '<div class="muted small">접수 '+new Date(t.at).toLocaleString('ko-KR')+(t.date?' · 희망 '+esc(t.date):'')+(t.memo?' · '+esc(t.memo):'')+'</div></div>').join('') : '<div class="empty">아직 문의가 없습니다.</div>';
  return card('예약·렌탈 상담 ('+bk.length+')', '<div class="admin">'+bkH+'</div><div><button class="btn sm" type="button" data-act="clear-bk">예약 목록 비우기</button></div>', '이 브라우저에서 접수한 건만 보입니다. 실제 운영에서는 서버 데이터베이스와 알림 발송 기록으로 대체됩니다.')+
    card('기업 전용 문의 ('+tc.length+')', '<div class="admin">'+tcH+'</div><div><button class="btn sm" type="button" data-act="clear-tc">문의 목록 비우기</button></div>');
}

/* ---------- 입력 반영 ---------- */
$('panel').addEventListener('change', e=>{ const el=e.target; if(!el.classList.contains('st')) return; api('inbox_update',{type:el.dataset.type,id:el.dataset.id,status:el.value}).then(r=>{ if(r.ok){ toast('상태를 "'+el.value+'"(으)로 바꿨습니다.'); loadInbox(false); } else toast('저장 실패: '+r.error,true); }).catch(ex=>toast('저장 실패: '+ex.message,true)); });
$('panel').addEventListener('input', e=>{ const el=e.target; if(el.dataset.tp){ const [i,k]=el.dataset.tp.split('.'); if(techs[+i]) techs[+i][k]= el.type==='checkbox'?el.checked:el.value; return; } const p=el.dataset.p; if(!p) return;
  let v; if(el.dataset.b) v=el.checked; else if(el.dataset.n){ v=el.value===''?0:Number(el.value); if(Number.isNaN(v)) return; } else v=el.value;
  setPath(draft,p,v); keepLocal(); });
$('panel').addEventListener('click', e=>{
  const a=e.target.closest('[data-add],[data-del],[data-act],[data-send-rec],[data-tech-del],[data-del-rec]'); if(!a) return;
  if(a.dataset.add){ const arr=getPath(draft,a.dataset.add); arr.push(JSON.parse(a.dataset.tpl)); keepLocal(); render(); return; }
  if(a.dataset.del){ const ks=a.dataset.del.split('.'); const idx=+ks.pop(); const arr=getPath(draft,ks.join('.')); if(!confirm('이 항목을 삭제할까요?')) return; arr.splice(idx,1); keepLocal(); render(); return; }
  if(a.dataset.act==='refresh'){ loadInbox(false); return; }
  if(a.dataset.act==='tech-add'){ techs.push({id:'T'+Date.now().toString(36).slice(-6),name:'',phone:'',area:'',skills:'',memo:'',active:true}); render(); return; }
  if(a.dataset.act==='tech-save'){ saveTechs(); return; }
  if(a.dataset.techDel!==undefined){ if(!confirm('이 기사를 목록에서 뺄까요?')) return; techs.splice(+a.dataset.techDel,1); render(); return; }
  if(a.dataset.sendRec){ const b=inbox.bookings.find(x=>x.id===a.dataset.sendRec); if(b) openSend(b); return; }
  if(a.dataset.delRec){ if(!confirm('이 접수를 삭제할까요? 되돌릴 수 없습니다.')) return; api('inbox_update',{type:a.dataset.delRec,id:a.dataset.id,delete:true}).then(r=>{ if(r.ok){ toast('삭제했습니다.'); loadInbox(false); } else toast('삭제 실패: '+r.error,true); }).catch(e=>toast('삭제 실패: '+e.message,true)); return; }
  if(a.dataset.act==='clear-bk'){ if(confirm('예약 목록을 비울까요?')){ save('ssw_bookings',[]); render(); } }
  if(a.dataset.act==='clear-tc'){ if(confirm('문의 목록을 비울까요?')){ save('ssw_biz',[]); render(); } }
});

/* ---------- 동작 버튼 ---------- */
$('act-more').addEventListener('click',()=>$('more').classList.toggle('open'));
$('act-preview').addEventListener('click',()=>{ try{ localStorage.setItem('ssw_preview_cfg', JSON.stringify(toConfig())); }catch(e){} window.open('index.html?preview=1','ssw_preview'); });
$('act-save').addEventListener('click', async ()=>{
  if(mode==='local'){ keepLocal(); download(); return; }
  const btn=$('act-save'); btn.disabled=true;
  try{ const r=await api('save',{config:toConfig()}); if(r.ok) toast('저장했습니다. 고객 페이지는 새로고침하면 바로 반영됩니다.'); else if(r.error==='auth'){ toast('로그인이 풀렸습니다. 다시 로그인해 주세요.',true); $('editor').hidden=true; $('gate').hidden=false; $('login').hidden=false; } else toast('저장 실패: '+(r.message||r.error), true); }
  catch(e){ toast('저장 실패: '+e.message, true); } finally{ btn.disabled=false; }
});
function download(){ const blob=new Blob(['window.SSW_CONFIG = '+JSON.stringify(toConfig(),null,1)+';\n'],{type:'text/javascript'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='config.js'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); toast('config.js 를 내려받았습니다. data/config.js 에 넣고 배포하세요.'); }
$('act-download').addEventListener('click',download);
$('act-export').addEventListener('click',()=>{ const blob=new Blob([JSON.stringify(toConfig(),null,1)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='sokshiwon-config-'+new Date().toISOString().slice(0,10)+'.json'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); });
$('act-import').addEventListener('change', e=>{ const f=e.target.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ try{ let t=String(rd.result).trim().replace(/^window\.SSW_CONFIG\s*=\s*/,'').replace(/;\s*$/,''); const cfg=JSON.parse(t); draft=fromConfig(cfg); keepLocal(); render(); toast('가져왔습니다. 확인 후 저장하세요.'); }catch(ex){ toast('파일을 읽지 못했습니다: '+ex.message,true); } }; rd.readAsText(f); e.target.value=''; });
const RESET={basic:['site.brand','site.contact','site.biz'],home:['site.home'],pages:['site.pages'],guide:['site.promises','site.steps','site.faq'],rates:['rates','site.priceLabels'],brands:['brands'],rent:['rent']};
$('act-reset').addEventListener('click',()=>{ const ks=RESET[tab]; if(!ks) return; if(!confirm('이 탭의 값을 기본값으로 되돌릴까요? 저장 전까지는 서버에 반영되지 않습니다.')) return; ks.forEach(p=>setPath(draft,p,clone(getPath(DEFAULTS,p)))); keepLocal(); render(); });
$('act-reset-all').addEventListener('click',()=>{ if(!confirm('모든 설정을 기본값으로 되돌릴까요? 저장 전까지는 서버에 반영되지 않습니다.')) return; draft=fromConfig({}); keepLocal(); render(); });
window.addEventListener('beforeunload', e=>{ if(mode==='server' && draft && $('editor') && !$('editor').hidden){ /* 저장 안 한 변경 보호는 생략: 폼 입력이 잦아 경고가 번거로움 */ } });

init();
})();
</script>
</body>
