<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>관리자 · 속시원</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top"></header>
<main class="wrap">

<div class="page-head">
  <span class="eyebrow">관리자 미리보기</span>
  <h1>접수된 예약과 기사 신청</h1>
  <p>이 브라우저에서 접수한 건만 보입니다. 실제 운영에서는 서버 데이터베이스, 알림 발송 기록, 기사 배정 현황으로 대체됩니다.</p>
</div>

<section>
  <div class="sec-head"><h2>예약 <span class="tag" id="bk-count">0</span></h2></div>
  <div class="admin" id="bk-list"></div>
  <div style="padding-top:12px"><button class="btn sm" type="button" id="bk-clear">예약 목록 비우기</button></div>
</section>

<section>
  <div class="sec-head"><h2>기사 등록 신청 <span class="tag" id="tc-count">0</span></h2></div>
  <div class="admin" id="tc-list"></div>
  <div style="padding-top:12px"><button class="btn sm" type="button" id="tc-clear">신청 목록 비우기</button></div>
</section>

</main>
<footer></footer>
<script src="js/common.js"></script>
<script>
(function(){
'use strict';
const {$, load, save, esc, rangeShort, rangeText, fmtDate} = window.SSW;
function render(){
  const bk=load('ssw_bookings'); $('bk-count').textContent=bk.length;
  $('bk-list').innerHTML = bk.length ? bk.map(b=>
    '<div class="bk"><div class="h"><span>'+b.id+' · '+esc(b.svcLabel)+'</span><span class="tag '+(b.status.startsWith('기사 수락')?'ok':b.status.startsWith('거절')?'warn':'acc')+'">'+esc(b.status)+'</span></div>'+
    '<div>'+esc(b.summary)+' · <b class="num">'+rangeShort(b.total[0],b.total[1])+'</b></div>'+
    (b.models&&b.models.length?'<div class="muted">'+esc(b.models.join(', '))+'</div>':'')+
    '<div class="muted">'+esc(b.customer.name)+' · '+esc(b.customer.phone)+' · '+esc(b.customer.addr)+' '+esc(b.customer.addr2)+'</div>'+
    '<div class="muted">희망 '+fmtDate(b.customer.date)+' '+esc(b.customer.slot)+' · 기사 정산 <span class="num">'+rangeText(b.payout[0],b.payout[1])+'</span></div>'+
    '<div class="muted small">접수 '+new Date(b.createdAt).toLocaleString('ko-KR')+(b.site?' · '+esc(b.site):'')+(b.customer.memo?' · 메모: '+esc(b.customer.memo):'')+'</div></div>').join('')
    : '<div class="empty">아직 접수된 예약이 없습니다.</div>';
  const tc=load('ssw_techs'); $('tc-count').textContent=tc.length;
  $('tc-list').innerHTML = tc.length ? tc.map(t=>'<div class="bk"><div class="h"><span>'+esc(t.name)+' · '+esc(t.area)+'</span><span class="tag">'+esc(t.exp)+'</span></div><div class="muted">'+esc(t.phone)+' · '+esc((t.jobs||[]).join(', ')||'작업 미선택')+' · '+new Date(t.at).toLocaleString('ko-KR')+'</div></div>').join('')
    : '<div class="empty">아직 신청이 없습니다.</div>';
}
$('bk-clear').addEventListener('click',()=>{ save('ssw_bookings',[]); render(); });
$('tc-clear').addEventListener('click',()=>{ save('ssw_techs',[]); render(); });
render();
})();
</script>
</body>
</html>
