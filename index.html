<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>속시원</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<script>try{if(!sessionStorage.getItem('ssw_splash')){sessionStorage.setItem('ssw_splash','1');if(!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){document.documentElement.classList.add('splash-on');setTimeout(function(){document.documentElement.classList.remove('splash-on')},2400)}}}catch(e){}</script>
<link rel="preload" as="image" href="img/logo-word.png">
<meta name="description" content="속시원 · 에어컨 설치, 청소, 냉매 충전, 이전 설치 무료 견적. 조건만 고르면 금액이 바로 나옵니다.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sunn-us/SUIT@2/fonts/variable/woff2/SUIT-Variable.css">
<link rel="stylesheet" href="css/style.css?v=20261015n">
</head>
<body>
<header class="top"></header>
<main class="home-main">

  <section class="promo" aria-label="추천">
    <div class="promo-track" id="promo"></div>
    <div class="promo-ctl" aria-live="polite"><button type="button" class="nav-btn" id="promo-prev" aria-label="이전 공지"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button><span id="promo-pos">1 / 3</span><button type="button" class="nav-btn" id="promo-next" aria-label="다음 공지"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button><button type="button" id="promo-pause" aria-label="자동 넘김 멈춤"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button></div>
  </section>

  <section class="stats" id="stats" aria-label="실적" hidden><div class="in" id="stats-in"></div></section>

  <section aria-labelledby="quick-title">
    <div class="sec-title"><h2 id="quick-title" data-t="home.titles.quick">속시원하게 무료견적내기!</h2></div>
    <nav class="igrid">
      <a href="install.html" data-menu="install"><span class="ico"><span class="em" aria-hidden="true">🏠</span></span><span data-t="home.quick.install">가정용 설치</span></a>
      <a href="shop.html" data-menu="shop"><span class="ico"><span class="em" aria-hidden="true">🏬</span></span><span data-t="home.quick.shop">상가·사무실</span></a>
      <a href="move.html" data-menu="move"><span class="ico"><span class="em" aria-hidden="true">🚚</span></span><span data-t="home.quick.move">이전 설치</span></a>
      <a href="clean.html" data-menu="clean"><span class="ico"><span class="em" aria-hidden="true">🧼</span></span><span data-t="home.quick.clean">분해 청소</span></a>
      <a href="gas.html" data-menu="gas"><span class="ico"><span class="em" aria-hidden="true">❄️</span></span><span data-t="home.quick.gas">냉매 충전</span></a>
      <a href="business.html" data-menu="business"><span class="ico"><span class="em" aria-hidden="true">🏢</span></span><span data-t="home.quick.business">기업 문의</span></a>
    </nav>
  </section>

  <section aria-labelledby="reviews-title" id="reviews-sec" hidden>
    <div class="sec-title"><h2 id="reviews-title" data-t="home.titles.reviews">속시원한 고객 후기!</h2></div>
    <div class="rv-wrap"><div class="rv-track" id="rv-track"></div></div>
  </section>

  <section aria-labelledby="promise-title">
    <div class="sec-title"><h2 id="promise-title" data-t="home.titles.promise">속시원하게 약속!</h2></div>
    <div class="pgrid" id="home-promises"></div>
  </section>

  <section aria-labelledby="steps-title">
    <div class="sec-title"><h2 id="steps-title" data-t="home.titles.steps">속시원하게 진행!</h2></div>
    <div class="sgrid" id="home-steps"></div>
  </section>

  <section class="contact-band" aria-labelledby="contact-title">
    <div>
      <span class="eyebrow">상담</span>
      <h2 id="contact-title" style="margin-top:6px" data-t="home.titles.contact">궁금한 건 전화나 카톡으로 연락주세요!<br>속시원하게 답변드립니다!</h2>
    </div>
    <div class="row">
      <button class="btn primary" type="button" id="contact-link" data-t="home.links.contact">전화·카카오톡 상담</button>
      <p class="small" id="contact" hidden></p>
    </div>
  </section>

</main>
<footer></footer>
<script>document.write('<script src="data/config.js?t='+Date.now()+'"><\/script>');</script>
<script src="js/common.js?v=20261015n"></script>
<script>
(function(){
  const S=window.SSW, SITE=S.SITE, e=S.esc, c=SITE.contact;
  document.getElementById('home-promises').innerHTML=(SITE.promises||[]).map((p,i)=>'<div><span class="idx">'+(i+1)+'</span><b>'+e(p.title)+'</b><span>'+e(p.desc)+'</span></div>').join('');
  document.getElementById('home-steps').innerHTML=(SITE.steps||[]).map((p,i)=>'<div><span class="idx">'+(i+1)+'단계</span><b>'+e(p.title)+'</b><span>'+e(p.desc)+'</span></div>').join('');
  document.getElementById('contact').innerHTML='상담 전화 <b class="num">'+e(c.phone)+'</b> · 카카오톡 채널 <b>'+e(c.kakaoId)+'</b>'+(c.note?' ('+e(c.note)+')':'');
  document.getElementById('contact-link').addEventListener('click', ()=>{ document.getElementById('contact').hidden=false; });

  /* 추천 슬라이드: 4.5초마다 다음 카드로. 손으로 넘기거나 멈춤 버튼을 누르면 자동 넘김 중단. 동작 줄이기 설정이면 자동 넘김 없음 */
  /* 실적 띠: 칸마다 자동 집계(서버 접수·기사 수 + 기준값) 또는 관리자가 적은 값. 관리자 > 기본 정보 > 첫 화면 실적 띠 */
  (function(){
    const ST=SITE.stats||{}; const items=(Array.isArray(ST.items)?ST.items:[]).filter(it=>it&&it.label).slice(0,4);
    if(ST.show===false||!items.length) return;
    const needServer=items.some(it=>it.auto);
    const draw=srv=>{
      document.getElementById('stats-in').innerHTML=items.map(it=>{ const auto=it.auto&&srv&&srv.ok; const n=it.auto?((+it.base||0)+((auto&&+srv[it.auto])||0)):null;
        return '<div><span class="k">'+e(it.label)+'</span>'+(it.auto?'<b class="num" data-n="'+n+'">0</b>':'<b>'+e(it.value||'')+'</b>')+(it.unit?'<small>'+e(it.unit)+'</small>':'')+'</div>'; }).join('');
      document.getElementById('stats').hidden=false;
      const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
      document.querySelectorAll('#stats b[data-n]').forEach(el=>{ const target=+el.dataset.n; if(reduce||target<30){ el.textContent=target.toLocaleString('ko-KR'); return; } const t0=performance.now(); const step=t=>{ const p=Math.min(1,(t-t0)/900); el.textContent=Math.round(target*(1-Math.pow(1-p,3))).toLocaleString('ko-KR'); if(p<1) requestAnimationFrame(step); }; requestAnimationFrame(step); });
    };
    if(!needServer){ draw(null); return; }
    fetch('admin/api.php?action=stats&_='+Date.now()).then(r=>r.text()).then(t=>{ let j=null; try{ j=JSON.parse(t); }catch(x){} draw(j); }).catch(()=>draw(null));
  })();

  /* 고객 후기: 사진 1장당 후기 1개, 왼쪽으로 천천히 흐르고 손을 올리면 멈춤 (관리자 > 후기) */
  (function(){
    const list=(SITE.reviews||[]).filter(r=>r&&(r.text||r.img)); if(!list.length) return;
    const STAR='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z"/></svg>';
    const card=r=>'<article class="rv">'+(r.img?'<div class="ph"><img src="'+e(r.img)+'" alt="'+e(r.svc||'')+' 시공 사진" loading="lazy"></div>':'')+'<div class="bd"><div class="st" aria-label="별점 5점">'+STAR.repeat(5)+'</div><p>'+e(r.text||'')+'</p><div class="who"><b>'+e(r.name||'')+'</b>'+(r.area?' · '+e(r.area):'')+(r.svc?' · '+e(r.svc):'')+(r.date?'<span>'+e(r.date)+'</span>':'')+'</div></div></article>';
    const html=list.map(card).join('');
    const track=document.getElementById('rv-track'); track.innerHTML=html+html;   /* 두 번 이어 붙여 끊김 없이 순환 */
    track.style.setProperty('--rv-n', list.length);
    document.getElementById('reviews-sec').hidden=false;
  })();

  /* 추천 슬라이드 카드는 관리자 (예전 기본 사진 img/home-bg.jpg 가 저장돼 있으면 img/home-slide1.jpg 로 읽음) > 첫 화면 > 추천 슬라이드 값으로 만듭니다 */
  const track=document.getElementById('promo');
  track.innerHTML=(SITE.home.promo||[]).filter(p=>p&&p.title).map((p,i)=>'<a class="slide s'+(i%3+1)+'" href="'+e(p.href||'install.html')+'"><div class="txt"><b>'+e(p.title).replace(/\n/g,'<br>')+'</b>'+(p.desc?'<p>'+e(p.desc)+'</p>':'')+'</div>'+
    (p.cta?'<span class="cta">'+e(p.cta)+' <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>':'')+(p.img?'<div class="pic"><img src="'+e(p.img==='img/home-bg.jpg'?'img/home-slide1.jpg':(p.img==='img/products/samsung-wall.jpg'?'img/home-slide2.jpg':p.img))+'" alt=""'+(i?' loading="lazy"':' fetchpriority="high"')+'></div>':'')+'</a>').join('');
  const slides=[...track.children], pos=document.getElementById('promo-pos'), pauseBtn=document.getElementById('promo-pause');
  if(slides.length<2) document.querySelector('.promo-ctl').hidden=true;
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  let cur=0, timer=null, paused=reduce;
  const ICON_PAUSE='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
  const ICON_PLAY='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5l11 7-11 7z"/></svg>';
  const go=i=>{ cur=(i+slides.length)%slides.length; track.scrollTo({left:slides[cur].offsetLeft-track.offsetLeft, behavior:reduce?'auto':'smooth'}); };
  const start=()=>{ stop(); if(!paused) timer=setInterval(()=>go(cur+1), 4500); };
  const stop=()=>{ if(timer){ clearInterval(timer); timer=null; } };
  const setPaused=p=>{ paused=p; pauseBtn.innerHTML=p?ICON_PLAY:ICON_PAUSE; pauseBtn.setAttribute('aria-label', p?'자동 넘김 시작':'자동 넘김 멈춤'); start(); };
  pauseBtn.addEventListener('click', ()=>setPaused(!paused));
  document.getElementById('promo-prev').addEventListener('click', ()=>{ go(cur-1); start(); });
  document.getElementById('promo-next').addEventListener('click', ()=>{ go(cur+1); start(); });
  if('IntersectionObserver' in window){
    const io=new IntersectionObserver(es=>{ es.forEach(x=>{ if(x.isIntersecting){ cur=slides.indexOf(x.target); pos.textContent=(cur+1)+' / '+slides.length; } }); }, {root:track, threshold:.6});
    slides.forEach(s=>io.observe(s));
  }
  track.addEventListener('pointerdown', stop, {passive:true});
  track.addEventListener('pointerup', ()=>setTimeout(start, 600), {passive:true});
  track.addEventListener('mouseenter', stop); track.addEventListener('mouseleave', start);
  document.addEventListener('visibilitychange', ()=>document.hidden?stop():start());
  setPaused(paused);


})();
</script>
</body>
</html>
