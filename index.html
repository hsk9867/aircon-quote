<script>document.write('<script src="data/config.js?t='+Date.now()+'"><\/script>');</script>
<script src="js/common.js?v=20261014l"></script>
<script>
(function(){
  const S=window.SSW, SITE=S.SITE, e=S.esc, c=SITE.contact;
  document.getElementById('home-promises').innerHTML=(SITE.promises||[]).map((p,i)=>'<div><span class="idx">'+(i+1)+'</span><b>'+e(p.title)+'</b><span>'+e(p.desc)+'</span></div>').join('');
  document.getElementById('home-steps').innerHTML=(SITE.steps||[]).map((p,i)=>'<div><span class="idx">'+(i+1)+'단계</span><b>'+e(p.title)+'</b><span>'+e(p.desc)+'</span></div>').join('');
  document.getElementById('contact').innerHTML='상담 전화 <b class="num">'+e(c.phone)+'</b> · 카카오톡 채널 <b>'+e(c.kakaoId)+'</b>'+(c.note?' ('+e(c.note)+')':'');
  document.getElementById('contact-link').addEventListener('click', ()=>{ document.getElementById('contact').hidden=false; });

  /* 추천 슬라이드: 4.5초마다 다음 카드로. 손으로 넘기거나 멈춤 버튼을 누르면 자동 넘김 중단. 동작 줄이기 설정이면 자동 넘김 없음 */
  const track=document.getElementById('promo'), slides=[...track.children], pos=document.getElementById('promo-pos'), pauseBtn=document.getElementById('promo-pause');
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  let cur=0, timer=null, paused=reduce;
  const ICON_PAUSE='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
  const ICON_PLAY='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5l11 7-11 7z"/></svg>';
  const go=i=>{ cur=(i+slides.length)%slides.length; track.scrollTo({left:slides[cur].offsetLeft-track.offsetLeft, behavior:reduce?'auto':'smooth'}); };
  const start=()=>{ stop(); if(!paused) timer=setInterval(()=>go(cur+1), 4500); };
  const stop=()=>{ if(timer){ clearInterval(timer); timer=null; } };
  const setPaused=p=>{ paused=p; pauseBtn.innerHTML=p?ICON_PLAY:ICON_PAUSE; pauseBtn.setAttribute('aria-label', p?'자동 넘김 시작':'자동 넘김 멈춤'); start(); };
  pauseBtn.addEventListener('click', ()=>setPaused(!paused));
  if('IntersectionObserver' in window){
    const io=new IntersectionObserver(es=>{ es.forEach(x=>{ if(x.isIntersecting){ cur=slides.indexOf(x.target); pos.textContent=(cur+1)+' / '+slides.length; } }); }, {root:track, threshold:.6});
    slides.forEach(s=>io.observe(s));
  }
  track.addEventListener('pointerdown', stop, {passive:true});
  track.addEventListener('pointerup', ()=>setTimeout(start, 600), {passive:true});
  track.addEventListener('mouseenter', stop); track.addEventListener('mouseleave', start);
  document.addEventListener('visibilitychange', ()=>document.hidden?stop():start());
  setPaused(paused);

  /* 취급 브랜드 로고. 관리자 > 브랜드·제품의 "로고 이미지 주소"가 있으면 그 그림을, 없으면 기본 로고(삼성·LG는 Simple Icons CDN, 캐리어는 글자 로고)를 씁니다 */
  const DEFAULT_LOGO = {samsung:'https://cdn.simpleicons.org/samsung/1428A0', lg:'https://cdn.simpleicons.org/lg/A50034'};
  const WORDMARK = {carrier:{text:'Carrier', color:'#0033A0'}};
  document.getElementById('brand-row').innerHTML = (S.BRANDS||[]).map(b=>{
    const src = b.logo || DEFAULT_LOGO[b.id]; const wm = WORDMARK[b.id];
    const mark = src ? '<img src="'+e(src)+'" alt="'+e(b.name)+' 로고" loading="lazy">' : (wm ? '<span class="wm" style="color:'+wm.color+'">'+e(wm.text)+'</span>' : '<span class="wm">'+e(b.name)+'</span>');
    return '<a class="bcell" href="install.html"><span class="mark">'+mark+'</span><span class="nm">'+e(b.name)+'</span></a>';
  }).join('');
})();
</script>
