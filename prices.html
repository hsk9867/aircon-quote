<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>단가표 · 속시원</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<meta name="robots" content="noindex,nofollow">
<script>try{if(!sessionStorage.getItem('ssw_splash')){sessionStorage.setItem('ssw_splash','1');if(!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){document.documentElement.classList.add('splash-on');setTimeout(function(){document.documentElement.classList.remove('splash-on')},2400)}}}catch(e){}</script>
<link rel="preload" as="image" href="img/logo-word.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sunn-us/SUIT@2/fonts/variable/woff2/SUIT-Variable.css">
<link rel="stylesheet" href="css/style.css?v=20261015w">
</head>
<body>
<header class="top"></header>
<main class="wrap">

<div class="page-head">
  <span class="eyebrow" data-t="pages.prices.eyebrow">가격 안내</span>
  <h1 data-t="pages.prices.title">설치·청소·충전 단가표 전체 공개</h1>
  <p data-t="pages.prices.desc">모든 견적 페이지는 아래 단가로 계산합니다. '기준'은 시중 공개 단가를 출발점으로 삼은 값이고, '가정'은 지역 기사 인터뷰로 확정해야 하는 값입니다.</p>
</div>

<section>
  <div class="sec-head"><h2>기종별 단가</h2></div>
  <div class="tbl-wrap"><table id="t-type"><thead><tr><th>항목</th><th class="r">벽걸이</th><th class="r">스탠드</th><th class="r">2in1</th></tr></thead><tbody></tbody></table></div>
</section>

<section>
  <div class="sec-head"><h2>시스템 에어컨 (3대 이상)</h2><p class="small muted">천장형 실내기를 실외기 1대에 묶는 구성입니다.</p></div>
  <div class="tbl-wrap"><table id="t-sys"><thead><tr><th>항목</th><th class="r">금액</th></tr></thead><tbody></tbody></table></div>
</section>

<section>
  <div class="sec-head"><h2>공통 항목</h2></div>
  <div class="tbl-wrap"><table id="t-common"><thead><tr><th>항목</th><th class="r">금액</th></tr></thead><tbody></tbody></table></div>
</section>

<section>
  <div class="sec-head"><span class="eyebrow">약속</span><h2>가격이 현장에서 바뀌지 않도록</h2></div>
  <div class="plist2" id="promises"></div>
</section>

<section>
  <div class="sec-head"><span class="eyebrow">진행 절차</span><h2>접수부터 A/S까지</h2></div>
  <div class="steps" id="steps"></div>
</section>

<section class="faq">
  <div class="sec-head"><span class="eyebrow">자주 묻는 질문</span><h2>궁금한 점</h2></div>
  <div id="faq"></div>
</section>

</main>
<footer></footer>
<script>document.write('<script src="data/config.js?t='+Date.now()+'"><\/script>');</script>
<script src="js/common.js?v=20261015u"></script>
<script>
(function(){
'use strict';
const {RATES, SITE, manWon, add, esc, $} = window.SSW;
$('promises').innerHTML=SITE.promises.map(p=>'<div><span class="ck">✓</span><div><b>'+esc(p.title)+'</b><span>'+esc(p.desc)+'</span></div></div>').join('');
$('steps').innerHTML=SITE.steps.map(p=>'<div class="step"><div><b>'+esc(p.title)+'</b><span>'+esc(p.desc)+'</span></div></div>').join('');
$('faq').innerHTML=SITE.faq.map(f=>'<details><summary>'+esc(f.q)+'</summary><p>'+esc(f.a)+'</p></details>').join('');
const rt = r => (!r || (!r[0] && !r[1])) ? 'X' : r[0]===r[1] ? manWon(r[0]) : manWon(r[0])+'~'+manWon(r[1]); /* 0원 항목은 X (해당 없음) */
const row3 = (l,r) => '<tr><td>'+l+'</td><td class="r num">'+rt(r.wall)+'</td><td class="r num">'+rt(r.stand)+'</td><td class="r num">'+rt(r.two)+'</td></tr>';
const row1 = (l,r,s) => '<tr><td>'+l+'</td><td class="r num">'+(r?rt(r):esc(String(s||'').replace(/^(가정|기준)[^·]*·\s*/,'').replace(/\s*\((가정|기준)\)$/,'')))+'</td></tr>';
const L = k => (SITE.priceLabels && SITE.priceLabels[k]) || k;
document.querySelector('#t-type tbody').innerHTML = [
  ['base',RATES.base],['moveBase',RATES.moveBase],['remove',RATES.remove],['pipePerM',RATES.pipePerM],['pipeReplace',RATES.pipeReplace],['angle',RATES.angle],
  ['clean',RATES.clean],['fan',RATES.fan],['gasFill',RATES.gasFill],['gas',RATES.gas],['paper',RATES.paper],['protect',RATES.protect]
].map(([k,r])=>row3(L(k),r)).join('');
const C=RATES.ceil;
document.querySelector('#t-sys tbody').innerHTML = [
  ['ceilIndoor',C.indoor,''],['ceilHatch',add(C.hatch,C.drain),''],['ceilOutdoor',(C.outdoor&&C.outdoor[1])?C.outdoor:null,'실내기 가격에 포함'],
  ['ceilClean',C.clean,''],['ceilProtect',C.protect,''],['ceilPaper',C.paper,''],['ceilGas',C.gas,'']
].map(([k,r,s])=>row1(L(k),r,s)).join('');
document.querySelector('#t-common tbody').innerHTML = [
  ['hole',RATES.hole,''],['elec',null,'기본 '+rt(RATES.elecBase)+' + 대당 '+rt(RATES.elecPer)],['ladder',RATES.ladder,''],
  ['outdoorClean',RATES.outdoorClean,''],['visit',RATES.visit,''],['leakCheck',RATES.leakCheck||[0,80000],'필요 시'],['oldPart',RATES.oldPart,''],
  ['regionOut',RATES.regionOut,''],['dist',null,rt(RATES.distCity)+' / '+rt(RATES.distFar)],['floor',null,rt(RATES.floorMid)+' / '+rt(RATES.floorHigh)],
  ['multiDiscount',null,'2대째부터 기본 설치비 '+Math.round(RATES.multiDiscount*100)+'%'],['cleanDiscount',null,'3대부터 10%'],['housePipe',null,'외벽·지상 경로 '+RATES.housePipe[0]+'~'+RATES.housePipe[1]+'m 가산'],['seasonFactor',null,'시공비 × '+RATES.seasonFactor],
  ['gasFactor',null,'R410A ×1 · R32 ×1.1~1.2 · R22 ×1.3~1.6 · 모름 ×1~1.2']
].map(([k,r,s])=>row1(L(k),r,s)).join('');
})();
</script>
</body>
</html>
