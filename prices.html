<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>단가표 · 속시원</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<script>try{if(!sessionStorage.getItem('ssw_splash')){sessionStorage.setItem('ssw_splash','1');if(!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)){document.documentElement.classList.add('splash-on');setTimeout(function(){document.documentElement.classList.remove('splash-on')},2400)}}}catch(e){}</script>
<link rel="preload" as="image" href="img/logo.jpg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/style.css?v=20261012j">
</head>
<body>
<header class="top"></header>
<main class="wrap">

<div class="page-head">
  <span class="eyebrow" data-t="pages.prices.eyebrow">가격 안내</span>
  <h1 data-t="pages.prices.title">설치·청소·충전 단가표 전체 공개</h1>
  <p data-t="pages.prices.desc">모든 견적 페이지는 아래 단가로 계산합니다. '기준'은 시중 공개 단가를 출발점으로 삼은 값이고, '가정'은 지역 기사 인터뷰로 확정해야 하는 값입니다.</p>
</div>

<section>
  <div class="sec-head"><h2>기종별 단가</h2></div>
  <div class="tbl-wrap"><table id="t-type"><thead><tr><th>항목</th><th class="r">벽걸이</th><th class="r">스탠드</th><th class="r">2in1</th></tr></thead><tbody></tbody></table></div>
</section>

<section>
  <div class="sec-head"><h2>시스템 에어컨 (3대 이상)</h2><p class="small muted">천장형 실내기를 실외기 1대에 묶는 구성입니다.</p></div>
  <div class="tbl-wrap"><table id="t-sys"><thead><tr><th>항목</th><th class="r">금액</th></tr></thead><tbody></tbody></table></div>
</section>

<section>
  <div class="sec-head"><h2>공통 항목</h2></div>
  <div class="tbl-wrap"><table id="t-common"><thead><tr><th>항목</th><th class="r">금액</th></tr></thead><tbody></tbody></table></div>
</section>

<section>
  <div class="sec-head"><span class="eyebrow">약속</span><h2>가격이 현장에서 바뀌지 않도록</h2></div>
  <div class="plist2" id="promises"></div>
</section>

<section>
  <div class="sec-head"><span class="eyebrow">진행 절차</span><h2>접수부터 A/S까지</h2></div>
  <div class="steps" id="steps"></div>
</section>

<section class="faq">
  <div class="sec-head"><span class="eyebrow">자주 묻는 질문</span><h2>궁금한 점</h2></div>
  <div id="faq"></div>
</section>

</main>
<footer></footer>
<script src="data/config.js?v=20261012j"></script>
<script src="js/common.js?v=20261012j"></script>
<script>
(function(){
'use strict';
const {RATES, SITE, manWon, add, esc, $} = window.SSW;
$('promises').innerHTML=SITE.promises.map(p=>'<div><span class="ck">✓</span><div><b>'+esc(p.title)+'</b><span>'+esc(p.desc)+'</span></div></div>').join('');
$('steps').innerHTML=SITE.steps.map(p=>'<div class="step"><div><b>'+esc(p.title)+'</b><span>'+esc(p.desc)+'</span></div></div>').join('');
$('faq').innerHTML=SITE.faq.map(f=>'<details><summary>'+esc(f.q)+'</summary><p>'+esc(f.a)+'</p></details>').join('');
const rt = r => r[0]===r[1] ? manWon(r[0]) : manWon(r[0])+'~'+manWon(r[1]);
const row3 = (l,r) => '<tr><td>'+l+'</td><td class="r num">'+rt(r.wall)+'</td><td class="r num">'+rt(r.stand)+'</td><td class="r num">'+rt(r.two)+'</td></tr>';
const row1 = (l,r,s) => '<tr><td>'+l+'</td><td class="r num">'+(r?rt(r):esc(String(s||'').replace(/^(가정|기준)[^·]*·\s*/,'').replace(/\s*\((가정|기준)\)$/,'')))+'</td></tr>';
document.querySelector('#t-type tbody').innerHTML = [
  ['신규 설치 기본 (배관 별도)',RATES.base],['이전 설치 기본 (배관 별도)',RATES.moveBase],['기존 에어컨 철거',RATES.remove],
  ['배관 (1m당)',RATES.pipePerM],['매립 배관 교체·연결',RATES.pipeReplace],['실외기 앵글',RATES.angle],
  ['분해 청소 (1대)',RATES.clean],['송풍팬 완전 분해',RATES.fan],['냉매 충전 (수리·충전 방문)',RATES.gasFill],['냉매 보충 (설치 시 긴 배관 분)',RATES.gas],
  ['부분 도배 마감',RATES.paper],['거주 중 가구 이동·보양',RATES.protect]
].map(([l,r])=>row3(l,r)).join('');
const C=RATES.ceil;
document.querySelector('#t-sys tbody').innerHTML = [
  ['천장형 실내기 설치 (1대)',C.indoor,''],['천장 점검구·타공 + 드레인 배관 (1대)',add(C.hatch,C.drain),'가정'],['시스템 실외기 1대 설치 (실내기 공용)',C.outdoor,'가정'],
  ['천장형 분해 청소 (1대)',C.clean,'가정'],['거주 중 천장 작업 보양 (1대)',C.protect,'가정'],['천장·벽 부분 도배 (1대)',C.paper,'가정'],['냉매 추가 충전 (긴 배관 분)',C.gas,'가정']
].map(([l,r,s])=>row1(l,r,s)).join('');
document.querySelector('#t-common tbody').innerHTML = [
  ['타공 (1곳)',RATES.hole,'가정'],['전용 전기 작업',null,'가정 · 기본 '+rt(RATES.elecBase)+' + 대당 '+rt(RATES.elecPer)],['사다리차·스카이차 (4시간)',RATES.ladder,'기준 · 에어아이'],
  ['실외기 세척 (1대)',RATES.outdoorClean,'가정'],['수리·충전 출장 점검비',RATES.visit,'가정'],['누설 점검·용접',[0,80000],'가정 · 필요 시'],['구형 모델 부품 수급 가산',RATES.oldPart,'가정'],
  ['인접 지역 출장 가산',RATES.regionOut,'가정'],['운반 (같은 시·군 / 다른 시·도)',null,'가정 · '+rt(RATES.distCity)+' / '+rt(RATES.distFar)],['층수 가산 (3~5층 / 6층 이상)',null,'가정 · '+rt(RATES.floorMid)+' / '+rt(RATES.floorHigh)],
  ['동시 설치 할인',null,'2대째부터 기본 설치비 10% (가정)'],['청소 다량 할인',null,'3대부터 10% (가정)'],['주택 배관 연장',null,'외벽·지상 경로 '+RATES.housePipe[0]+'~'+RATES.housePipe[1]+'m 가산 (가정)'],['성수기 계수 (6~8월)',null,'시공비 × '+RATES.seasonFactor+' (가정)'],
  ['냉매 종류 계수',null,'R410A ×1 · R32 ×1.1~1.2 · R22 ×1.3~1.6 · 모름 ×1~1.2 (가정)']
].map(([l,r,s])=>row1(l,r,s)).join('');
})();
</script>
</body>
</html>
